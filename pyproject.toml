[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "finaudit-rag"
version = "0.1.0"
description = "Source-cited question answering for financial and regulatory PDFs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pdfplumber==0.11.9"]

[project.optional-dependencies]
dev = [
    "build==1.2.2.post1",
    "mypy==1.15.0",
    "pytest==8.3.5",
    "ruff==0.11.13",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
module = ["pdfplumber", "pdfplumber.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
