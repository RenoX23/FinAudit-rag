name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      db:
        image: pgvector/pgvector:0.8.7-pg16-bookworm
        env:
          POSTGRES_DB: finaudit_test
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d finaudit_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      FINAUDIT_TEST_DATABASE_URL: postgresql://postgres@localhost:5432/finaudit_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install development tools
        run: python -m pip install ".[dev]"
      - name: Lint
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: Type check
        run: python -m mypy src tests
      - name: Test
        run: python -m pytest
      - name: Validate local Compose configuration
        run: FINAUDIT_POSTGRES_PASSWORD=ci-only docker compose config --quiet
      - name: Validate corpus manifest
        run: python -m finaudit_rag.corpus data/corpus.json
      - name: Build package
        run: python -m build
